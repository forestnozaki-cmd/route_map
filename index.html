<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>国土地理院地図 A3-3枚配置 & CAD図面重ね合わせ</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    /* 画面表示および印刷設定 */
    body {
      margin: 0;
      padding: 20px;
      background-color: #f0f0f0;
      font-family: sans-serif;
    }

    /* A3サイズの用紙枠（横向き: 420mm x 297mm） */
    .a3-page {
      width: 420mm;
      height: 297mm;
      background-color: white;
      margin: 0 auto;
      padding: 15mm;
      box-sizing: border-box;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
      display: flex;
      gap: 10mm;
    }

    /* 各地図を包む枠 */
    .map-container {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* 上部エリアの統一高さ（105px） */
    .map-top-area, .cad-panel-area {
      height: 105px;
      padding: 6px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      background-color: #f8f9fa;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-bottom: 4px;
      flex-shrink: 0;
    }

    /* 地図とタイトルバーを包む下部枠 */
    .map-main-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      border: 1px solid #999;
      position: relative;
    }

    /* 検索窓・ボタン配置エリア */
    .search-box {
      display: flex;
      gap: 6px;
      width: 100%;
      align-items: center;
    }

    .search-input {
      flex: 1;
      padding: 5px 8px;
      font-size: 10pt;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
      background-color: #fff;
      color: #333;
    }

    .search-button {
      padding: 5px 10px;
      font-size: 10pt;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      white-space: nowrap;
    }

    .search-button:hover { background-color: #0056b3; }
    .search-button:disabled { background-color: #aaa; cursor: not-allowed; }

    /* 土地名称エリア */
    .site-name-box {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 4px;
      width: 100%;
    }

    .prefix-input {
      width: 75px;
      padding: 5px 4px;
      font-size: 11pt;
      font-weight: bold;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
      background-color: #fff;
      color: #333;
      box-sizing: border-box;
      text-align: right;
    }

    .site-name-input {
      flex: 1;
      max-width: 220px;
      padding: 5px 8px;
      font-size: 11pt;
      font-weight: bold;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
      background-color: #fff;
      color: #333;
      box-sizing: border-box;
      text-align: right;
    }

    /* キャプション（見出し）部分 */
    .map-title {
      background-color: #333;
      color: white;
      padding: 6px 10px;
      font-weight: bold;
      font-size: 12pt;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .map-title-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 個別地図切替ボタン */
    .map-type-btn {
      padding: 2px 6px;
      font-size: 8pt;
      background-color: #fd7e14;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-weight: bold;
      white-space: nowrap;
    }
    .map-type-btn:hover { background-color: #e06805; }

    .map-scale-container {
      font-size: 11pt;
      font-weight: normal;
      color: #ddd;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .scale-input {
      width: 85px;
      padding: 3px 6px;
      font-size: 11pt;
      border: 1px solid #000000;
      border-radius: 4px;
      text-align: right;
      background-color: #000000;
      color: #ffffff;
      outline: none;
    }

    /* 地図描画エリア */
    .map-box {
      flex: 1;
      width: 100%;
      position: relative;
    }

    .compass-icon {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 48px;
      height: 56px;
      z-index: 1000;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.85);
      padding: 4px;
      border-radius: 4px;
      box-shadow: 0 0 4px rgba(0,0,0,0.15);
    }

    /* 操作パネル共通スタイル */
    .panel-control-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
      font-size: 8.5pt;
    }

    .panel-control-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .panel-control-row label {
      display: flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
      font-weight: bold;
    }

    /* 最上部アクションボタン群 */
    .action-btn {
      padding: 3px 8px;
      font-size: 8pt;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    .btn-reset { background-color: #dc3545; }
    .btn-reset:hover { background-color: #bd2130; }
    .btn-save { background-color: #28a745; }
    .btn-save:hover { background-color: #218838; }
    .btn-load { background-color: #007bff; }
    .btn-load:hover { background-color: #0069d9; }

    .cad-btn-group {
      display: inline-flex;
      gap: 2px;
    }

    .cad-btn {
      padding: 2px 6px;
      font-size: 8pt;
      background: #6c757d;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      user-select: none;
    }
    .cad-btn:hover { background: #5a6268; }
    .cad-btn:active { background: #343a40; }

    .size-info-tag {
      background: #e9ecef;
      padding: 2px 5px;
      border-radius: 3px;
      font-weight: bold;
      color: #0d6efd;
    }

    /* リーフレットのカスタムマーカー枠 */
    .custom-leaflet-marker {
      background: none;
      border: none;
    }

    /* 印刷設定 */
    @page { size: A3 landscape; margin: 0; }
    @media print {
      body { background: none; padding: 0; }
      .a3-page { box-shadow: none; }
      .scale-input { border: none; background: transparent; color: #ffffff; padding: 0; width: auto; }
      .map-top-area, .cad-panel-area { border: 1px solid #ffffff; background: transparent; }
      .search-box, .panel-control-container, .map-type-btn, .no-print { display: none !important; }
      .prefix-input, .site-name-input {
        border: none !important;
        background: transparent !important;
        color: #000 !important;
        font-size: 12pt !important;
        font-weight: bold !important;
        padding: 0 !important;
        text-align: right;
      }
      .prefix-input { width: auto !important; }
      .site-name-input { width: auto !important; }
      .compass-icon { background: transparent; box-shadow: none; }
      /* 印刷時に拡大調整ボタンを非表示 */
      .leaflet-control-zoom { display: none !important; }
    }
  </style>
</head>
<body>

  <!-- 方位マーク用SVG -->
  <svg style="display:none;">
    <g id="north-compass">
      <svg viewBox="0 0 100 120" width="100%" height="100%">
        <text x="50" y="21" font-family="sans-serif" font-weight="bold" font-size="22" text-anchor="middle" fill="#000">N</text>
        <g transform="translate(50,72)">
          <circle cx="0" cy="0" r="38" fill="none" stroke="#000" stroke-width="1.2"/>
          <circle cx="0" cy="0" r="28" fill="none" stroke="#000" stroke-width="0.8"/>
          <polygon points="0,0 0,-42 -7,-6" fill="#000"/>
          <polygon points="0,0 0,-42 7,-6" fill="#fff" stroke="#000" stroke-width="0.8"/>
          <polygon points="0,0 0,42 7,-6" fill="#000"/>
          <polygon points="0,0 0,42 -7,-6" fill="#fff" stroke="#000" stroke-width="0.8"/>
          <polygon points="0,0 42,0 6,-7" fill="#000"/>
          <polygon points="0,0 42,0 6,7" fill="#fff" stroke="#000" stroke-width="0.8"/>
          <polygon points="0,0 -42,0 -6,7" fill="#000"/>
          <polygon points="0,0 -42,0 -6,-7" fill="#fff" stroke="#000" stroke-width="0.8"/>
        </g>
      </svg>
    </g>
  </svg>

  <div class="a3-page">
    
    <!-- 1枚目：広域図（ポインタ & データ操作パネル） -->
    <div class="map-container">
      <div class="map-top-area">
        <div class="panel-control-container">
          <!-- 1行目: データ操作ボタン -->
          <div class="panel-control-row" style="gap: 4px;">
            <button id="btnReset" class="action-btn btn-reset">RESET</button>
            <button id="btnSave" class="action-btn btn-save">SAVE</button>
            <button id="btnLoad" class="action-btn btn-load">LOAD</button>
            <input type="file" id="jsonFileInput" accept=".json" style="display:none;">
          </div>
          <!-- 2行目: ポインタ形状・色 -->
          <div class="panel-control-row">
            <label><b>ポインタ</b> 形状:
              <select id="ptrShape" style="font-size:8pt;">
                <option value="pin">標準ピン</option>
                <option value="arrow">矢印</option>
                <option value="triangle">▼ 逆三角</option>
              </select>
            </label>
            <label>色:
              <select id="ptrColor" style="font-size:8pt;">
                <option value="#007bff">青</option>
                <option value="#dc3545" selected>赤</option>
                <option value="#fd7e14">オレンジ</option>
                <option value="#198754">緑</option>
              </select>
            </label>
          </div>
          <!-- 3行目: 文字表示・テキスト・サイズ -->
          <div class="panel-control-row">
            <label><input type="checkbox" id="ptrShowText" checked> 文字表示:</label>
            <input type="text" id="ptrText" placeholder="名称" style="width:65px; font-size:8pt; padding:2px;">
            <label>サイズ:
              <select id="ptrFontSize" style="font-size:8pt;">
                <option value="10">10px</option>
                <option value="12" selected>12px</option>
                <option value="14">14px</option>
                <option value="16">16px</option>
                <option value="18">18px</option>
              </select>
            </label>
          </div>
        </div>
      </div>
      <div class="map-main-body">
        <div class="map-title">
          <div class="map-title-left">
            <span>広域図</span>
            <button class="map-type-btn" id="mapTypeBtn1">OSM切替</button>
          </div>
          <div class="map-scale-container"><span>1 /</span><input type="number" id="scaleInput1" class="scale-input" value="25000"></div>
        </div>
        <div id="map1" class="map-box"><svg class="compass-icon"><use href="#north-compass"/></svg></div>
      </div>
    </div>

    <!-- 2枚目：中域図（CAD操作パネル） -->
    <div class="map-container">
      <div class="cad-panel-area">
        <div class="panel-control-container">
          <div class="panel-control-row">
            <label>縮尺: 1/<input type="number" id="cadPresetScale" value="500" min="1" style="width: 42px; text-align:right;"></label>
            <label>サイズ:
              <select id="cadDpiSelect" style="font-size:8pt;">
                <option value="A4_H" selected>A4横 (297mm)</option>
                <option value="A4_V">A4縦 (210mm)</option>
                <option value="A3_H">A3横 (420mm)</option>
                <option value="A3_V">A3縦 (297mm)</option>
                <option value="300">300 DPI</option>
                <option value="150">150 DPI</option>
                <option value="96">96 DPI</option>
              </select>
            </label>
            <label>図面: <input type="file" id="cadFileInput" accept="image/png, image/jpeg" style="width:110px;"></label>
          </div>

          <div id="cadControls" class="panel-control-row" style="display:none;">
            <span id="cadCalculatedSize" class="size-info-tag">実寸: --m × --m</span>
            <label>太さ: 
              <select id="cadLineThickness" style="font-size:8pt;">
                <option value="2">2px</option>
                <option value="5" selected>5px</option>
                <option value="10">10px</option>
                <option value="15">15px</option>
                <option value="20">20px</option>
              </select>
            </label>
            <label>色: 
              <select id="cadLineColor" style="font-size:8pt;">
                <option value="#000000">黒</option>
                <option value="#ff0000">赤</option>
                <option value="#0055ff">青</option>
              </select>
            </label>

            <label>移動：</label>
            <div class="cad-btn-group">
              <button class="cad-btn" id="moveUp">↑</button>
              <button class="cad-btn" id="moveDown">↓</button>
              <button class="cad-btn" id="moveLeft">←</button>
              <button class="cad-btn" id="moveRight">→</button>
            </div>

            <label>倍率: 
              <input type="range" id="cadScale" min="0.5" max="2.0" step="0.05" value="1.0" style="width: 35px;">
              <input type="number" id="cadScaleNum" min="0.5" max="2.0" step="0.05" value="1.00" style="width: 48px; text-align:right;">倍
            </label>

            <label>回転: 
              <input type="range" id="cadRotate" min="-180" max="180" step="1" value="0" style="width: 30px;">
              <input type="number" id="cadRotateNum" min="-180" max="180" value="0" style="width: 40px; text-align:right;">°
            </label>

            <label>透明: <input type="range" id="cadOpacity" min="0.1" max="1" step="0.05" value="0.9" style="width: 30px;"></label>

            <button class="cad-btn" id="resetCad" style="background:#dc3545;">消去</button>
          </div>
        </div>
      </div>
      <div class="map-main-body">
        <div class="map-title">
          <div class="map-title-left">
            <span>中域図</span>
            <button class="map-type-btn" id="mapTypeBtn2">OSM切替</button>
          </div>
          <div class="map-scale-container"><span>1 /</span><input type="number" id="scaleInput2" class="scale-input" value="7500"></div>
        </div>
        <div id="map2" class="map-box"><svg class="compass-icon"><use href="#north-compass"/></svg></div>
      </div>
    </div>

    <!-- 3枚目：近隣地図 -->
    <div class="map-container">
      <div class="map-top-area">
        <div class="search-box">
          <input type="text" id="searchInput" class="search-input" placeholder="住所・地番を入力（例: 茅野市宮川1380-3）">
          <button id="searchBtn" class="search-button">検索</button>
        </div>
        <div class="site-name-box">
          <label class="no-print" style="font-size:8.5pt; display:flex; align-items:center; gap:2px; cursor:pointer;">
            <input type="checkbox" id="showPrefix" checked> 接頭辞
          </label>
          <input type="text" id="prefixInput" class="prefix-input" value="建設地：">
          <input type="text" id="siteNameInput" class="site-name-input" placeholder="土地名称を入力">
        </div>
      </div>
      <div class="map-main-body">
        <div class="map-title">
          <div class="map-title-left">
            <span>近隣地図</span>
            <button class="map-type-btn" id="mapTypeBtn3">OSM切替</button>
          </div>
          <div class="map-scale-container"><span>1 /</span><input type="number" id="scaleInput3" class="scale-input" value="2000"></div>
        </div>
        <div id="map3" class="map-box">
          <svg class="compass-icon"><use href="#north-compass"/></svg>
        </div>
      </div>
    </div>

  </div>

  <!-- Leaflet JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    const DEFAULT_LAT = 35.681236;
    const DEFAULT_LNG = 139.767125;

    let centerLat = DEFAULT_LAT;
    let centerLng = DEFAULT_LNG;

    // ポインタ（マーカー）インスタンス
    let marker1 = null, marker2 = null, marker3 = null;

    // CAD重ね合わせ関連変数
    let cadOverlay = null;
    let cadRawImage = null;
    let cadRawDataUrl = null;
    let cadCenterLat = DEFAULT_LAT;
    let cadCenterLng = DEFAULT_LNG;
    let cadBaseWidthMeters = 50; 
    let cadRealWidthMeters = 50;
    let cadRealHeightMeters = 50;
    let cadScaleFactor = 1.0;
    let cadRotationDeg = 0;

    const gsiTileUrl = 'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png';
    const gsiAttribution = '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>';
    const osmTileUrl = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
    const osmAttribution = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';

    /* ----------------------------------------------------
       土地名称の接頭辞切り替え
    ---------------------------------------------------- */
    const showPrefixCb = document.getElementById('showPrefix');
    const prefixInput = document.getElementById('prefixInput');
    showPrefixCb.addEventListener('change', () => {
      prefixInput.style.display = showPrefixCb.checked ? 'inline-block' : 'none';
    });

    function calculateScaleRatio(map) {
      const center = map.getCenter();
      const zoom = map.getZoom();
      const metersPerPx = (40075016.686 * Math.cos(center.lat * Math.PI / 180)) / (Math.pow(2, zoom) * 256);
      return Math.round(metersPerPx / (0.0254 / 96));
    }

    function getZoomFromScale(scaleRatio, lat) {
      const metersPerPxForZoom0 = (40075016.686 * Math.cos(lat * Math.PI / 180)) / 256;
      const targetMetersPerPx = scaleRatio * (0.0254 / 96);
      return Math.log2(metersPerPxForZoom0 / targetMetersPerPx);
    }

    function updateInputField(map, inputId) {
      const input = document.getElementById(inputId);
      if (document.activeElement !== input) {
        input.value = calculateScaleRatio(map);
      }
    }

    function createGsiMap(elementId, inputId, initialScale) {
      const initialZoom = getZoomFromScale(initialScale, centerLat);

      const map = L.map(elementId, { zoomSnap: 0.1, zoomDelta: 0.1 }).setView([centerLat, centerLng], initialZoom);
      const tileLayer = L.tileLayer(gsiTileUrl, { attribution: gsiAttribution, maxNativeZoom: 18, maxZoom: 22, minZoom: 5 }).addTo(map);

      updateInputField(map, inputId);

      return { map, tileLayer, currentMapType: 'gsi' };
    }

    const obj1 = createGsiMap('map1', 'scaleInput1', 25000);
    const obj2 = createGsiMap('map2', 'scaleInput2', 7500);
    const obj3 = createGsiMap('map3', 'scaleInput3', 2000);

    const map1 = obj1.map;
    const map2 = obj2.map;
    const map3 = obj3.map;

    /* ----------------------------------------------------
       個別地図切替処理
    ---------------------------------------------------- */
    function setupMapTypeToggle(obj, btnId) {
      const btn = document.getElementById(btnId);
      btn.addEventListener('click', () => {
        if (obj.currentMapType === 'gsi') {
          obj.tileLayer.options.maxNativeZoom = 19;
          obj.tileLayer.setUrl(osmTileUrl);
          obj.map.attributionControl.removeAttribution(gsiAttribution);
          obj.map.attributionControl.addAttribution(osmAttribution);
          obj.currentMapType = 'osm';
          btn.textContent = '地理院地図切替';
        } else {
          obj.tileLayer.options.maxNativeZoom = 18;
          obj.tileLayer.setUrl(gsiTileUrl);
          obj.map.attributionControl.removeAttribution(osmAttribution);
          obj.map.attributionControl.addAttribution(gsiAttribution);
          obj.currentMapType = 'gsi';
          btn.textContent = 'OSM切替';
        }
      });
    }

    setupMapTypeToggle(obj1, 'mapTypeBtn1');
    setupMapTypeToggle(obj2, 'mapTypeBtn2');
    setupMapTypeToggle(obj3, 'mapTypeBtn3');

    /* ----------------------------------------------------
       縮尺入力ボックス（100刻み & 近似値丸め処理）
    ---------------------------------------------------- */
    function setupScaleInputRounding(inputId, map) {
      const input = document.getElementById(inputId);
      input.setAttribute('step', '100');
      let lastVal = parseFloat(input.value);

      map.on('zoomend moveend', () => {
        updateInputField(map, inputId);
        lastVal = parseFloat(input.value);
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          let val = lastVal;
          if (val % 100 !== 0) val = Math.ceil(val / 100) * 100;
          else val += 100;
          input.value = val;
          lastVal = val;
          map.setZoom(getZoomFromScale(val, map.getCenter().lat));
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          let val = lastVal;
          if (val % 100 !== 0) val = Math.floor(val / 100) * 100;
          else val -= 100;
          if (val < 100) val = 100;
          input.value = val;
          lastVal = val;
          map.setZoom(getZoomFromScale(val, map.getCenter().lat));
        }
      });

      input.addEventListener('input', (e) => {
        if (e.inputType === 'insertText' || e.inputType === 'deleteContentBackward' || e.inputType === 'deleteContentForward') {
          return;
        }

        let currentVal = parseFloat(input.value);
        if (isNaN(currentVal)) return;

        if (currentVal !== lastVal) {
          let newVal = lastVal;
          if (currentVal > lastVal) {
            if (lastVal % 100 !== 0) newVal = Math.ceil(lastVal / 100) * 100;
            else newVal = lastVal + 100;
          } else {
            if (lastVal % 100 !== 0) newVal = Math.floor(lastVal / 100) * 100;
            else newVal = lastVal - 100;
          }
          if (newVal < 100) newVal = 100;
          input.value = newVal;
          lastVal = newVal;
          map.setZoom(getZoomFromScale(newVal, map.getCenter().lat));
        }
      });

      input.addEventListener('change', () => {
        let val = parseFloat(input.value);
        if (!isNaN(val) && val > 0) {
          lastVal = val;
          map.setZoom(getZoomFromScale(val, map.getCenter().lat));
        }
      });
    }

    setupScaleInputRounding('scaleInput1', map1);
    setupScaleInputRounding('scaleInput2', map2);
    setupScaleInputRounding('scaleInput3', map3);

    // 赤枠連動
    let redFrame2on1 = null, redFrame3on2 = null;
    function updateRedFrame2on1() {
      const bounds = map2.getBounds();
      if (redFrame2on1) redFrame2on1.setBounds(bounds);
      else redFrame2on1 = L.rectangle(bounds, { color: '#ff0000', weight: 2, fill: true, fillColor: '#ff0000', fillOpacity: 0.1 }).addTo(map1);
    }
    function updateRedFrame3on2() {
      const bounds = map3.getBounds();
      if (redFrame3on2) redFrame3on2.setBounds(bounds);
      else redFrame3on2 = L.rectangle(bounds, { color: '#ff0000', weight: 2, fill: true, fillColor: '#ff0000', fillOpacity: 0.1 }).addTo(map2);
    }

    setTimeout(() => { updateRedFrame2on1(); updateRedFrame3on2(); }, 200);
    map2.on('move zoom', updateRedFrame2on1);
    map3.on('move zoom', updateRedFrame3on2);

    /* ----------------------------------------------------
       カスタムポインタ
    ---------------------------------------------------- */
    function getCustomIcon() {
      const shape = document.getElementById('ptrShape').value;
      const color = document.getElementById('ptrColor').value;
      const showText = document.getElementById('ptrShowText').checked;
      const textVal = document.getElementById('ptrText').value.trim();
      const fontSize = document.getElementById('ptrFontSize').value;

      let svgHtml = '';
      if (shape === 'pin') {
        svgHtml = `<svg viewBox="0 0 24 36" width="24" height="36"><path d="M12 0C5.37 0 0 5.37 0 12c0 9 12 24 12 24s12-15 12-24c0-6.63-5.37-12-12-12zm0 16c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z" fill="${color}" stroke="#ffffff" stroke-width="1.2"/></svg>`;
      } else if (shape === 'arrow') {
        svgHtml = `<svg viewBox="0 0 24 36" width="24" height="36"><path d="M12 36L2 18h6V2h8v16h6L12 36z" fill="${color}" stroke="#ffffff" stroke-width="1.2"/></svg>`;
      } else if (shape === 'triangle') {
        svgHtml = `<svg viewBox="0 0 24 24" width="24" height="24"><polygon points="0,2 24,2 12,24" fill="${color}" stroke="#ffffff" stroke-width="1.5"/></svg>`;
      }

      const textHtml = (showText && textVal)
        ? `<div style="font-size:${fontSize}px; font-weight:bold; color:#000; background:rgba(255,255,255,0.95); border:1.5px solid ${color}; padding:1px 5px; border-radius:4px; white-space:nowrap; margin-bottom:2px;">${textVal}</div>`
        : '';

      const html = `<div style="display:flex; flex-direction:column; align-items:center; transform: translate(-50%, -100%); cursor:grab; pointer-events:auto;">
                      ${textHtml}
                      ${svgHtml}
                    </div>`;

      return L.divIcon({
        html: html,
        className: 'custom-leaflet-marker',
        iconSize: [0, 0],
        iconAnchor: [0, 0]
      });
    }

    function updateAllMarkersIcon() {
      const icon = getCustomIcon();
      if (marker1) marker1.setIcon(icon);
      if (marker2) marker2.setIcon(icon);
      if (marker3) marker3.setIcon(icon);
    }

    function setAllMarkersLatLng(lat, lng) {
      const icon = getCustomIcon();

      if (!marker1) marker1 = L.marker([lat, lng], { icon: icon, interactive: false }).addTo(map1);
      else marker1.setLatLng([lat, lng]);

      if (!marker2) marker2 = L.marker([lat, lng], { icon: icon, interactive: false }).addTo(map2);
      else marker2.setLatLng([lat, lng]);

      if (!marker3) {
        marker3 = L.marker([lat, lng], { icon: icon, draggable: true }).addTo(map3);
        const syncPos = () => {
          const pos = marker3.getLatLng();
          if (marker1) marker1.setLatLng(pos);
          if (marker2) marker2.setLatLng(pos);
        };
        marker3.on('drag', syncPos);
        marker3.on('dragend', syncPos);
      } else {
        marker3.setLatLng([lat, lng]);
      }
      updateAllMarkersIcon();
    }

    setAllMarkersLatLng(centerLat, centerLng);

    document.getElementById('ptrShape').addEventListener('change', updateAllMarkersIcon);
    document.getElementById('ptrColor').addEventListener('change', updateAllMarkersIcon);
    document.getElementById('ptrShowText').addEventListener('change', updateAllMarkersIcon);
    document.getElementById('ptrText').addEventListener('input', updateAllMarkersIcon);
    document.getElementById('ptrFontSize').addEventListener('change', updateAllMarkersIcon);

    /* ----------------------------------------------------
       CAD画像処理 & 重ね合わせ
    ---------------------------------------------------- */
    function processAndThickenImage(img, lineThickness = 5, lineColor = '#000000', threshold = 220) {
      const c1 = document.createElement('canvas');
      c1.width = img.width;
      c1.height = img.height;
      const ctx1 = c1.getContext('2d');
      ctx1.drawImage(img, 0, 0);

      const imgData = ctx1.getImageData(0, 0, c1.width, c1.height);
      const data = imgData.data;

      const rTarget = parseInt(lineColor.slice(1, 3), 16);
      const gTarget = parseInt(lineColor.slice(3, 5), 16);
      const bTarget = parseInt(lineColor.slice(5, 7), 16);

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i + 1], b = data[i + 2];
        if (r >= threshold && g >= threshold && b >= threshold) {
          data[i + 3] = 0;
        } else {
          data[i] = rTarget;
          data[i + 1] = gTarget;
          data[i + 2] = bTarget;
          data[i + 3] = 255;
        }
      }
      ctx1.putImageData(imgData, 0, 0);

      if (lineThickness <= 1) return c1.toDataURL('image/png');

      const c2 = document.createElement('canvas');
      c2.width = img.width;
      c2.height = img.height;
      const ctx2 = c2.getContext('2d');

      const radius = Math.floor(lineThickness / 2);
      const step = radius > 3 ? 2 : 1; 

      for (let x = -radius; x <= radius; x += step) {
        for (let y = -radius; y <= radius; y += step) {
          if (x * x + y * y <= radius * radius + 1) {
            ctx2.drawImage(c1, x, y);
          }
        }
      }
      return c2.toDataURL('image/png');
    }

    function updateCadTransform() {
      if (!cadOverlay) return;

      cadRealWidthMeters = cadBaseWidthMeters * cadScaleFactor;
      const aspect = cadRawImage.height / cadRawImage.width;
      cadRealHeightMeters = cadRealWidthMeters * aspect;

      const latDeg = cadRealHeightMeters / 111000;
      const lngDeg = cadRealWidthMeters / (111000 * Math.cos(cadCenterLat * Math.PI / 180));

      const bounds = [
        [cadCenterLat - latDeg / 2, cadCenterLng - lngDeg / 2],
        [cadCenterLat + latDeg / 2, cadCenterLng + lngDeg / 2]
      ];

      cadOverlay.setBounds(bounds);

      const el = cadOverlay.getElement();
      if (el) {
        el.style.transformOrigin = 'center center';
        const currentTransform = el.style.transform.replace(/rotate\([^)]*\)/g, '');
        el.style.transform = `${currentTransform} rotate(${cadRotationDeg}deg)`;
      }

      document.getElementById('cadCalculatedSize').textContent = 
        `実寸: ${cadRealWidthMeters.toFixed(1)}m × ${cadRealHeightMeters.toFixed(1)}m`;
    }

    map3.on('layeradd move zoom', updateCadTransform);

    function renderCadOverlay() {
      if (!cadRawImage) return;

      const thickness = parseInt(document.getElementById('cadLineThickness').value);
      const color = document.getElementById('cadLineColor').value;
      const processedSrc = processAndThickenImage(cadRawImage, thickness, color);

      if (cadOverlay) map3.removeLayer(cadOverlay);

      cadOverlay = L.imageOverlay(processedSrc, [[cadCenterLat, cadCenterLng], [cadCenterLat, cadCenterLng]], {
        opacity: parseFloat(document.getElementById('cadOpacity').value),
        interactive: false
      }).addTo(map3);

      updateCadTransform();
    }

    document.getElementById('cadFileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const scaleDenominator = parseFloat(document.getElementById('cadPresetScale').value) || 500;
      const sizePreset = document.getElementById('cadDpiSelect').value;

      const reader = new FileReader();
      reader.onload = function(event) {
        cadRawDataUrl = event.target.result;
        cadRawImage = new Image();
        cadRawImage.onload = function() {
          if (sizePreset === 'A4_H') cadBaseWidthMeters = 0.297 * scaleDenominator;
          else if (sizePreset === 'A4_V') cadBaseWidthMeters = 0.210 * scaleDenominator;
          else if (sizePreset === 'A3_H') cadBaseWidthMeters = 0.420 * scaleDenominator;
          else if (sizePreset === 'A3_V') cadBaseWidthMeters = 0.297 * scaleDenominator;
          else {
            const dpi = parseFloat(sizePreset);
            const widthInInches = cadRawImage.width / dpi;
            cadBaseWidthMeters = widthInInches * 0.0254 * scaleDenominator;
          }

          cadCenterLat = map3.getCenter().lat;
          cadCenterLng = map3.getCenter().lng;

          document.getElementById('cadControls').style.display = 'inline-flex';
          renderCadOverlay();
        };
        cadRawImage.src = cadRawDataUrl;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('cadLineThickness').addEventListener('change', renderCadOverlay);
    document.getElementById('cadLineColor').addEventListener('change', renderCadOverlay);

    function setCadScale(val) {
      cadScaleFactor = parseFloat(val) || 1.0;
      if (cadScaleFactor < 0.5) cadScaleFactor = 0.5;
      if (cadScaleFactor > 2.0) cadScaleFactor = 2.0;
      document.getElementById('cadScale').value = cadScaleFactor;
      document.getElementById('cadScaleNum').value = cadScaleFactor.toFixed(2);
      updateCadTransform();
    }
    document.getElementById('cadScale').addEventListener('input', (e) => setCadScale(e.target.value));
    document.getElementById('cadScaleNum').addEventListener('input', (e) => setCadScale(e.target.value));

    function setRotation(deg) {
      cadRotationDeg = parseInt(deg) || 0;
      if (cadRotationDeg > 180) cadRotationDeg = 180;
      if (cadRotationDeg < -180) cadRotationDeg = -180;
      document.getElementById('cadRotate').value = cadRotationDeg;
      document.getElementById('cadRotateNum').value = cadRotationDeg;
      updateCadTransform();
    }
    document.getElementById('cadRotate').addEventListener('input', (e) => setRotation(e.target.value));
    document.getElementById('cadRotateNum').addEventListener('input', (e) => setRotation(e.target.value));

    document.getElementById('cadOpacity').addEventListener('input', (e) => {
      if (cadOverlay) cadOverlay.setOpacity(parseFloat(e.target.value));
    });

    /* ----------------------------------------------------
       長押し連続移動処理
    ---------------------------------------------------- */
    const moveStep = 0.000006; 

    function attachLongPress(buttonId, action) {
      const btn = document.getElementById(buttonId);
      let timer = null;
      let interval = null;

      const start = (e) => {
        if (e.type === 'touchstart') e.preventDefault();
        action();
        timer = setTimeout(() => {
          interval = setInterval(action, 50);
        }, 200);
      };

      const stop = () => {
        if (timer) clearTimeout(timer);
        if (interval) clearInterval(interval);
        timer = null;
        interval = null;
      };

      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', stop);
      btn.addEventListener('mouseleave', stop);

      btn.addEventListener('touchstart', start, { passive: false });
      btn.addEventListener('touchend', stop);
      btn.addEventListener('touchcancel', stop);
    }

    attachLongPress('moveUp', () => { cadCenterLat += moveStep; updateCadTransform(); });
    attachLongPress('moveDown', () => { cadCenterLat -= moveStep; updateCadTransform(); });
    attachLongPress('moveLeft', () => { cadCenterLng -= moveStep; updateCadTransform(); });
    attachLongPress('moveRight', () => { cadCenterLng += moveStep; updateCadTransform(); });

    document.getElementById('resetCad').addEventListener('click', () => {
      if (cadOverlay) {
        map3.removeLayer(cadOverlay);
        cadOverlay = null;
      }
      cadRawImage = null;
      cadRawDataUrl = null;
      document.getElementById('cadFileInput').value = '';
      document.getElementById('cadControls').style.display = 'none';
    });

    // 地番検索処理
    async function doAddressSearch() {
      const rawQuery = document.getElementById('searchInput').value.trim();
      if (!rawQuery) return;

      const btn = document.getElementById('searchBtn');
      btn.textContent = '検索中...'; btn.disabled = true;

      function normalize(str) {
        let s = str.replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xfee0));
        return s.replace(/[－ー−―]/g, '-').replace(/(番地|番|号|の)/g, '-').replace(/-+/g, '-').replace(/-$/, '');
      }

      async function fetchCoords(q) {
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=jp`);
          if (res.ok) {
            const data = await res.json();
            if (data.length > 0) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
          }
        } catch (e) {}
        return null;
      }

      const norm = normalize(rawQuery);
      let result = await fetchCoords(rawQuery) || await fetchCoords(norm);

      if (result) {
        [map1, map2, map3].forEach(m => m.setView([result.lat, result.lng]));
        setAllMarkersLatLng(result.lat, result.lng);
        updateRedFrame2on1(); updateRedFrame3on2();
      } else {
        alert('該当する住所・地番が見つかりませんでした。');
      }

      btn.textContent = '検索'; btn.disabled = false;
    }

    document.getElementById('searchBtn').addEventListener('click', doAddressSearch);
    document.getElementById('searchInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') doAddressSearch(); });

    /* ----------------------------------------------------
       データ保存・復元・リセット処理 (RESET, SAVE, LOAD)
    ---------------------------------------------------- */
    function getMapStateData() {
      const markerPos = marker3 ? marker3.getLatLng() : { lat: centerLat, lng: centerLng };
      return {
        version: "1.0",
        maps: {
          map1: { center: map1.getCenter(), zoom: map1.getZoom(), scale: parseFloat(document.getElementById('scaleInput1').value), type: obj1.currentMapType },
          map2: { center: map2.getCenter(), zoom: map2.getZoom(), scale: parseFloat(document.getElementById('scaleInput2').value), type: obj2.currentMapType },
          map3: { center: map3.getCenter(), zoom: map3.getZoom(), scale: parseFloat(document.getElementById('scaleInput3').value), type: obj3.currentMapType }
        },
        marker: {
          lat: markerPos.lat,
          lng: markerPos.lng,
          shape: document.getElementById('ptrShape').value,
          color: document.getElementById('ptrColor').value,
          showText: document.getElementById('ptrShowText').checked,
          text: document.getElementById('ptrText').value,
          fontSize: document.getElementById('ptrFontSize').value
        },
        siteInfo: {
          showPrefix: document.getElementById('showPrefix').checked,
          prefix: document.getElementById('prefixInput').value,
          siteName: document.getElementById('siteNameInput').value
        },
        cad: {
          hasImage: !!cadRawDataUrl,
          imageData: cadRawDataUrl,
          presetScale: document.getElementById('cadPresetScale').value,
          dpiSelect: document.getElementById('cadDpiSelect').value,
          lineThickness: document.getElementById('cadLineThickness').value,
          lineColor: document.getElementById('cadLineColor').value,
          scaleFactor: cadScaleFactor,
          rotationDeg: cadRotationDeg,
          opacity: document.getElementById('cadOpacity').value,
          centerLat: cadCenterLat,
          centerLng: cadCenterLng,
          baseWidthMeters: cadBaseWidthMeters
        }
      };
    }

    function restoreMapStateData(data) {
      if (!data) return;

      // 地図位置と縮尺復元
      if (data.maps) {
        if (data.maps.map1) {
          map1.setView(data.maps.map1.center, data.maps.map1.zoom);
          document.getElementById('scaleInput1').value = data.maps.map1.scale;
          if (data.maps.map1.type !== obj1.currentMapType) document.getElementById('mapTypeBtn1').click();
        }
        if (data.maps.map2) {
          map2.setView(data.maps.map2.center, data.maps.map2.zoom);
          document.getElementById('scaleInput2').value = data.maps.map2.scale;
          if (data.maps.map2.type !== obj2.currentMapType) document.getElementById('mapTypeBtn2').click();
        }
        if (data.maps.map3) {
          map3.setView(data.maps.map3.center, data.maps.map3.zoom);
          document.getElementById('scaleInput3').value = data.maps.map3.scale;
          if (data.maps.map3.type !== obj3.currentMapType) document.getElementById('mapTypeBtn3').click();
        }
      }

      // ポインタ復元
      if (data.marker) {
        document.getElementById('ptrShape').value = data.marker.shape || 'pin';
        document.getElementById('ptrColor').value = data.marker.color || '#dc3545';
        document.getElementById('ptrShowText').checked = data.marker.showText !== false;
        document.getElementById('ptrText').value = data.marker.text || '';
        document.getElementById('ptrFontSize').value = data.marker.fontSize || '12';
        setAllMarkersLatLng(data.marker.lat, data.marker.lng);
      }

      // 土地名称復元
      if (data.siteInfo) {
        document.getElementById('showPrefix').checked = data.siteInfo.showPrefix !== false;
        document.getElementById('prefixInput').style.display = data.siteInfo.showPrefix !== false ? 'inline-block' : 'none';
        document.getElementById('prefixInput').value = data.siteInfo.prefix || '建設地：';
        document.getElementById('siteNameInput').value = data.siteInfo.siteName || '';
      }

      // CAD復元
      if (data.cad && data.cad.hasImage && data.cad.imageData) {
        cadRawDataUrl = data.cad.imageData;
        document.getElementById('cadPresetScale').value = data.cad.presetScale || 500;
        document.getElementById('cadDpiSelect').value = data.cad.dpiSelect || 'A4_H';
        document.getElementById('cadLineThickness').value = data.cad.lineThickness || 5;
        document.getElementById('cadLineColor').value = data.cad.lineColor || '#000000';
        document.getElementById('cadOpacity').value = data.cad.opacity || 0.9;
        
        cadBaseWidthMeters = data.cad.baseWidthMeters || 50;
        cadCenterLat = data.cad.centerLat;
        cadCenterLng = data.cad.centerLng;

        cadRawImage = new Image();
        cadRawImage.onload = function() {
          document.getElementById('cadControls').style.display = 'inline-flex';
          setCadScale(data.cad.scaleFactor || 1.0);
          setRotation(data.cad.rotationDeg || 0);
          renderCadOverlay();
        };
        cadRawImage.src = cadRawDataUrl;
      } else {
        document.getElementById('resetCad').click();
      }

      updateRedFrame2on1();
      updateRedFrame3on2();
    }

    // RESET ボタン
    document.getElementById('btnReset').addEventListener('click', () => {
      if (!confirm('初期画面に戻しますか？（入力内容は消去されます）')) return;

      centerLat = DEFAULT_LAT;
      centerLng = DEFAULT_LNG;

      document.getElementById('ptrShape').value = 'pin';
      document.getElementById('ptrColor').value = '#dc3545';
      document.getElementById('ptrShowText').checked = true;
      document.getElementById('ptrText').value = '';
      document.getElementById('ptrFontSize').value = '12';

      document.getElementById('showPrefix').checked = true;
      document.getElementById('prefixInput').style.display = 'inline-block';
      document.getElementById('prefixInput').value = '建設地：';
      document.getElementById('siteNameInput').value = '';
      document.getElementById('searchInput').value = '';

      if (obj1.currentMapType === 'osm') document.getElementById('mapTypeBtn1').click();
      if (obj2.currentMapType === 'osm') document.getElementById('mapTypeBtn2').click();
      if (obj3.currentMapType === 'osm') document.getElementById('mapTypeBtn3').click();

      map1.setView([centerLat, centerLng], getZoomFromScale(25000, centerLat));
      map2.setView([centerLat, centerLng], getZoomFromScale(7500, centerLat));
      map3.setView([centerLat, centerLng], getZoomFromScale(2000, centerLat));

      document.getElementById('scaleInput1').value = 25000;
      document.getElementById('scaleInput2').value = 7500;
      document.getElementById('scaleInput3').value = 2000;

      setAllMarkersLatLng(centerLat, centerLng);
      document.getElementById('resetCad').click();

      updateRedFrame2on1();
      updateRedFrame3on2();
    });

    // SAVE ボタン（名前を付けて保存）
    document.getElementById('btnSave').addEventListener('click', () => {
      const stateData = getMapStateData();
      const jsonStr = JSON.stringify(stateData, null, 2);
      const siteName = document.getElementById('siteNameInput').value.trim() || '地図配置データ';
      const fileName = `${siteName}.json`;

      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    // LOAD ボタン（保存したファイルを開く）
    document.getElementById('btnLoad').addEventListener('click', () => {
      document.getElementById('jsonFileInput').click();
    });

    document.getElementById('jsonFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const data = JSON.parse(event.target.result);
          restoreMapStateData(data);
        } catch (err) {
          alert('JSONファイルの読み込みに失敗しました。正しいフォーマットか確認してください。');
        }
      };
      reader.readAsText(file);
      e.target.value = ''; // 次回同じファイルを選べるようクリア
    });
  </script>
