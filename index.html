<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>国土地理院地図 A3-3枚配置</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    /* 画面表示および印刷設定 */
    body {
      margin: 0;
      padding: 20px;
      background-color: #f0f0f0;
      font-family: sans-serif;
    }

    /* A3サイズの用紙枠（横向き: 420mm x 297mm） */
    .a3-page {
      width: 420mm;
      height: 297mm;
      background-color: white;
      margin: 0 auto;
      padding: 15mm;
      box-sizing: border-box;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);

      /* 3つの枠を横並びにする設定 */
      display: flex;
      gap: 10mm;
    }

    /* 各地図を包む枠 */
    .map-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      border: 1px solid #999;
    }

    /* タイトルバー上部のエリア（検索窓配置用・背景塗りつぶしなし） */
    .map-top-area {
      min-height: 40px;
      padding: 4px 0;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      background-color: transparent;
    }

    /* 検索窓のスタイル */
    .search-box {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    .search-input {
      flex: 1;
      padding: 5px 8px;
      font-size: 10pt;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
      background-color: #fff;
      color: #333;
    }

    .search-button {
      padding: 5px 12px;
      font-size: 10pt;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .search-button:hover {
      background-color: #0056b3;
    }

    /* キャプション（見出し）部分 */
    .map-title {
      background-color: #333;
      color: white;
      padding: 8px 12px;
      font-weight: bold;
      font-size: 13pt;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 縮尺入力エリアのスタイル */
    .map-scale-container {
      font-size: 11pt;
      font-weight: normal;
      color: #ddd;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* 縮尺入力セル（黒背景・黒枠・白文字） */
    .scale-input {
      width: 85px;
      padding: 3px 6px;
      font-size: 11pt;
      border: 1px solid #000000;
      border-radius: 4px;
      text-align: right;
      background-color: #000000;
      color: #ffffff;
      outline: none;
    }

    .scale-input::-webkit-inner-spin-button,
    .scale-input::-webkit-outer-spin-button {
      filter: invert(1);
    }

    /* 地図描画エリア */
    .map-box {
      flex: 1;
      width: 100%;
    }

    /* 印刷時の用紙設定 */
    @page {
      size: A3 landscape;
      margin: 0;
    }

    @media print {
      body {
        background: none;
        padding: 0;
      }
      .a3-page {
        box-shadow: none;
      }
      .scale-input {
        border: none;
        background: transparent;
        color: #ffffff;
        padding: 0;
        width: auto;
      }
      /* 印刷時は検索エリア・スペーサーを非表示にして地図表示領域を広く確保 */
      .map-top-area {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- A3サイズの用紙コンテナ -->
  <div class="a3-page">
    
    <!-- 1枚目：広域図 -->
    <div class="map-container">
      <!-- 高さを揃えるための上部空欄スペーサー -->
      <div class="map-top-area"></div>
      
      <!-- 黒塗りタイトルバー -->
      <div class="map-title">
        <span>広域図</span>
        <div class="map-scale-container">
          <span>1 /</span>
          <input type="number" id="scaleInput1" class="scale-input" value="25000" step="100" min="100">
        </div>
      </div>
      <div id="map1" class="map-box"></div>
    </div>

    <!-- 2枚目：中域図 -->
    <div class="map-container">
      <!-- 高さを揃えるための上部空欄スペーサー -->
      <div class="map-top-area"></div>
      
      <!-- 黒塗りタイトルバー -->
      <div class="map-title">
        <span>中域図</span>
        <div class="map-scale-container">
          <span>1 /</span>
          <input type="number" id="scaleInput2" class="scale-input" value="7500" step="100" min="100">
        </div>
      </div>
      <div id="map2" class="map-box"></div>
    </div>

    <!-- 3枚目：近隣地図 -->
    <div class="map-container">
      <!-- タイトルバー上部の検索バーエリア（周囲塗りつぶしなし） -->
      <div class="map-top-area">
        <div class="search-box">
          <input type="text" id="searchInput" class="search-input" placeholder="住所・地番を入力（例: 東京都千代田区1-1）">
          <button id="searchBtn" class="search-button">検索</button>
        </div>
      </div>

      <!-- 黒塗りタイトルバー -->
      <div class="map-title">
        <span>近隣地図</span>
        <div class="map-scale-container">
          <span>1 /</span>
          <input type="number" id="scaleInput3" class="scale-input" value="2000" step="100" min="100">
        </div>
      </div>
      <div id="map3" class="map-box"></div>
    </div>

  </div>

  <!-- Leaflet JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // 1. 中心となる位置の設定（初期値: 東京駅）
    let centerLat = 35.681236;
    let centerLng = 139.767125;

    // 2. 国土地理院タイルのURLパターン（標準地図）
    const gsiTileUrl = 'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png';
    const gsiAttribution = '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>';

    // 3. 地図の現在のズーム/緯度から縮尺分母を計算する関数
    function calculateScaleRatio(map) {
      const center = map.getCenter();
      const zoom = map.getZoom();
      const metersPerPx = (40075016.686 * Math.cos(center.lat * Math.PI / 180)) / (Math.pow(2, zoom) * 256);
      return Math.round(metersPerPx / (0.0254 / 96));
    }

    // 4. 指定した縮尺分母から適切なズームレベルを計算する関数
    function getZoomFromScale(scaleRatio, lat) {
      const metersPerPxForZoom0 = (40075016.686 * Math.cos(lat * Math.PI / 180)) / 256;
      const targetMetersPerPx = scaleRatio * (0.0254 / 96);
      return Math.log2(metersPerPxForZoom0 / targetMetersPerPx);
    }

    // 5. 地図移動・ズーム時に入力欄の数値を更新する関数
    function updateInputField(map, inputId) {
      const input = document.getElementById(inputId);
      if (document.activeElement !== input) {
        input.value = calculateScaleRatio(map);
      }
    }

    // 6. 各枠に地図を初期化してタイルを読み込む関数
    function createGsiMap(elementId, inputId, initialScale) {
      const input = document.getElementById(inputId);
      const initialZoom = getZoomFromScale(initialScale, centerLat);

      const map = L.map(elementId, {
        zoomSnap: 0.1,
        zoomDelta: 0.1
      }).setView([centerLat, centerLng], initialZoom);

      L.tileLayer(gsiTileUrl, {
        attribution: gsiAttribution,
        maxZoom: 18,
        minZoom: 5
      }).addTo(map);

      const marker = L.marker([centerLat, centerLng]).addTo(map);

      updateInputField(map, inputId);

      map.on('zoomend moveend', function() {
        updateInputField(map, inputId);
      });

      function applyScaleFromInput() {
        const val = parseFloat(input.value);
        if (!isNaN(val) && val > 0) {
          const targetZoom = getZoomFromScale(val, map.getCenter().lat);
          map.setZoom(targetZoom);
        }
      }

      input.addEventListener('change', applyScaleFromInput);
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          applyScaleFromInput();
          input.blur();
        }
      });

      return { map, marker };
    }

    // 7. それぞれの枠を描画
    const obj1 = createGsiMap('map1', 'scaleInput1', 25000); // 広域図
    const obj2 = createGsiMap('map2', 'scaleInput2', 7500);  // 中域図
    const obj3 = createGsiMap('map3', 'scaleInput3', 2000);  // 近隣地図

    const map1 = obj1.map, marker1 = obj1.marker;
    const map2 = obj2.map, marker2 = obj2.marker;
    const map3 = obj3.map, marker3 = obj3.marker;

    // 8. 表示範囲の赤枠描画処理
    let redFrame2on1 = null;
    function updateRedFrame2on1() {
      const bounds = map2.getBounds();
      if (redFrame2on1) {
        redFrame2on1.setBounds(bounds);
      } else {
        redFrame2on1 = L.rectangle(bounds, {
          color: '#ff0000',
          weight: 2,
          fill: true,
          fillColor: '#ff0000',
          fillOpacity: 0.1
        }).addTo(map1);
      }
    }

    let redFrame3on2 = null;
    function updateRedFrame3on2() {
      const bounds = map3.getBounds();
      if (redFrame3on2) {
        redFrame3on2.setBounds(bounds);
      } else {
        redFrame3on2 = L.rectangle(bounds, {
          color: '#ff0000',
          weight: 2,
          fill: true,
          fillColor: '#ff0000',
          fillOpacity: 0.1
        }).addTo(map2);
      }
    }

    setTimeout(function() {
      updateRedFrame2on1();
      updateRedFrame3on2();
    }, 200);

    map2.on('move zoom', updateRedFrame2on1);
    map3.on('move zoom', updateRedFrame3on2);

    // 9. 国土地理院 住所検索APIを利用した検索処理（CORSエラー回避プロキシ付き）
    async function doAddressSearch() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      try {
        const gsiApiUrl = `https://msearch.gsi.go.jp/address-search-api/msearch/search?q=${encodeURIComponent(query)}`;
        // CORS回避プロキシを経由して通信
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(gsiApiUrl)}`;

        const response = await fetch(proxyUrl);
        const data = await response.json();

        if (data && data.length > 0) {
          const lng = data[0].geometry.coordinates[0];
          const lat = data[0].geometry.coordinates[1];

          [map1, map2, map3].forEach(map => map.setView([lat, lng]));
          [marker1, marker2, marker3].forEach(marker => marker.setLatLng([lat, lng]));

          updateRedFrame2on1();
          updateRedFrame3on2();
        } else {
          alert('該当する住所・地番が見つかりませんでした。入力内容をご確認ください。');
        }
      } catch (error) {
        console.error('Search error:', error);
        alert('住所検索中にエラーが発生しました。');
      }
    }

    document.getElementById('searchBtn').addEventListener('click', doAddressSearch);
    document.getElementById('searchInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        doAddressSearch();
      }
    });
  </script>

</body>
</html>
