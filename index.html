<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>国土地理院地図 A3-3枚配置</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    /* 画面表示および印刷設定 */
    body {
      margin: 0;
      padding: 20px;
      background-color: #f0f0f0;
      font-family: sans-serif;
    }

    /* A3サイズの用紙枠（横向き: 420mm x 297mm） */
    .a3-page {
      width: 420mm;
      height: 297mm;
      background-color: white;
      margin: 0 auto;
      padding: 15mm;
      box-sizing: border-box;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);

      /* 3つの枠を横並びにする設定 */
      display: flex;
      gap: 10mm;
    }

    /* 各地図を包む枠 */
    .map-container {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* タイトルバー上部のエリア（周囲枠線を白に設定） */
    .map-top-area {
      min-height: 40px;
      padding: 4px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      background-color: transparent;
      border: 1px solid #ffffff;
      margin-bottom: 2px;
    }

    /* 地図とタイトルバーを包む下部枠 */
    .map-main-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      border: 1px solid #999;
    }

    /* 検索窓・ボタン配置エリア */
    .search-box {
      display: flex;
      gap: 6px;
      width: 100%;
      align-items: center;
    }

    .search-input {
      flex: 1;
      padding: 5px 8px;
      font-size: 10pt;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
      background-color: #fff;
      color: #333;
    }

    .search-button {
      padding: 5px 10px;
      font-size: 10pt;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      white-space: nowrap;
    }

    .search-button:hover {
      background-color: #0056b3;
    }

    .search-button:disabled {
      background-color: #aaa;
      cursor: not-allowed;
    }

    /* 地図切り替えボタンのスタイル */
    .toggle-map-button {
      padding: 5px 10px;
      font-size: 9pt;
      background-color: #fd7e14;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      white-space: nowrap;
    }

    .toggle-map-button:hover {
      background-color: #e06d10;
    }

    /* キャプション（見出し）部分 */
    .map-title {
      background-color: #333;
      color: white;
      padding: 8px 12px;
      font-weight: bold;
      font-size: 13pt;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 縮尺入力エリアのスタイル */
    .map-scale-container {
      font-size: 11pt;
      font-weight: normal;
      color: #ddd;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* 縮尺入力セル（黒背景・黒枠・白文字） */
    .scale-input {
      width: 85px;
      padding: 3px 6px;
      font-size: 11pt;
      border: 1px solid #000000;
      border-radius: 4px;
      text-align: right;
      background-color: #000000;
      color: #ffffff;
      outline: none;
    }

    .scale-input::-webkit-inner-spin-button,
    .scale-input::-webkit-outer-spin-button {
      filter: invert(1);
    }

    /* 地図描画エリア */
    .map-box {
      flex: 1;
      width: 100%;
      position: relative;
    }

    /* 地図右上に配置する方位マークのスタイル */
    .compass-icon {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 48px;
      height: 56px;
      z-index: 1000;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.85);
      padding: 4px;
      border-radius: 4px;
      box-shadow: 0 0 4px rgba(0,0,0,0.15);
    }

    /* 印刷時の用紙設定 */
    @page {
      size: A3 landscape;
      margin: 0;
    }

    @media print {
      body {
        background: none;
        padding: 0;
      }
      .a3-page {
        box-shadow: none;
      }
      .scale-input {
        border: none;
        background: transparent;
        color: #ffffff;
        padding: 0;
        width: auto;
      }
      .map-top-area {
        border: 1px solid #ffffff;
        background: transparent;
      }
      .search-box {
        display: none;
      }
      .compass-icon {
        background: transparent;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>

  <!-- 方位マーク用SVG定義 -->
  <svg style="display:none;">
    <g id="north-compass">
      <svg viewBox="0 0 100 120" width="100%" height="100%">
        <text x="50" y="21" font-family="sans-serif" font-weight="bold" font-size="22" text-anchor="middle" fill="#000">N</text>
        <g transform="translate(50,72)">
          <circle cx="0" cy="0" r="38" fill="none" stroke="#000" stroke-width="1.2"/>
          <circle cx="0" cy="0" r="28" fill="none" stroke="#000" stroke-width="0.8"/>
          <polygon points="0,0 0,-42 -7,-6" fill="#000"/>
          <polygon points="0,0 0,-42 7,-6" fill="#fff" stroke="#000" stroke-width="0.8"/>
          <polygon points="0,0 0,42 7,-6" fill="#000"/>
          <polygon points="0,0 0,42 -7,6" fill="#fff" stroke="#000" stroke-width="0.8"/>
          <polygon points="0,0 42,0 6,-7" fill="#000"/>
          <polygon points="0,0 42,0 6,7" fill="#fff" stroke="#000" stroke-width="0.8"/>
          <polygon points="0,0 -42,0 -6,7" fill="#000"/>
          <polygon points="0,0 -42,0 -6,-7" fill="#fff" stroke="#000" stroke-width="0.8"/>
          <polygon points="0,0 28,-28 0,-6" fill="#000"/>
          <polygon points="0,0 28,-28 6,0" fill="#fff" stroke="#000" stroke-width="0.8"/>
          <polygon points="0,0 28,28 6,0" fill="#000"/>
          <polygon points="0,0 28,28 0,6" fill="#fff" stroke="#000" stroke-width="0.8"/>
          <polygon points="0,0 -28,28 0,6" fill="#000"/>
          <polygon points="0,0 -28,28 -6,0" fill="#fff" stroke="#000" stroke-width="0.8"/>
          <polygon points="0,0 -28,-28 -6,0" fill="#000"/>
          <polygon points="0,0 -28,-28 0,-6" fill="#fff" stroke="#000" stroke-width="0.8"/>
        </g>
      </svg>
    </g>
  </svg>

  <!-- A3サイズの用紙コンテナ -->
  <div class="a3-page">
    
    <!-- 1枚目：広域図 -->
    <div class="map-container">
      <div class="map-top-area"></div>
      <div class="map-main-body">
        <div class="map-title">
          <span>広域図</span>
          <div class="map-scale-container">
            <span>1 /</span>
            <input type="number" id="scaleInput1" class="scale-input" value="25000" step="100" min="100">
          </div>
        </div>
        <div id="map1" class="map-box">
          <svg class="compass-icon"><use href="#north-compass"/></svg>
        </div>
      </div>
    </div>

    <!-- 2枚目：中域図 -->
    <div class="map-container">
      <div class="map-top-area"></div>
      <div class="map-main-body">
        <div class="map-title">
          <span>中域図</span>
          <div class="map-scale-container">
            <span>1 /</span>
            <input type="number" id="scaleInput2" class="scale-input" value="7500" step="100" min="100">
          </div>
        </div>
        <div id="map2" class="map-box">
          <svg class="compass-icon"><use href="#north-compass"/></svg>
        </div>
      </div>
    </div>

    <!-- 3枚目：近隣地図 -->
    <div class="map-container">
      <div class="map-top-area">
        <div class="search-box">
          <input type="text" id="searchInput" class="search-input" placeholder="住所・地番を入力（例: 茅野市宮川）">
          <button id="searchBtn" class="search-button">検索</button>
          <button id="toggleMapBtn" class="toggle-map-button">OpenStreetMapに切り替え</button>
        </div>
      </div>
      <div class="map-main-body">
        <div class="map-title">
          <span>近隣地図</span>
          <div class="map-scale-container">
            <span>1 /</span>
            <input type="number" id="scaleInput3" class="scale-input" value="2000" step="100" min="100">
          </div>
        </div>
        <div id="map3" class="map-box">
          <svg class="compass-icon"><use href="#north-compass"/></svg>
        </div>
      </div>
    </div>

  </div>

  <!-- Leaflet JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // 1. 中心となる位置の設定（初期値: 東京駅）
    let centerLat = 35.681236;
    let centerLng = 139.767125;

    // 2. 地図タイルの設定
    const gsiTileUrl = 'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png';
    const gsiAttribution = '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>';
    
    const osmTileUrl = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
    const osmAttribution = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';

    // 3. 地図の現在のズーム/緯度から縮尺分母を計算する関数
    function calculateScaleRatio(map) {
      const center = map.getCenter();
      const zoom = map.getZoom();
      const metersPerPx = (40075016.686 * Math.cos(center.lat * Math.PI / 180)) / (Math.pow(2, zoom) * 256);
      return Math.round(metersPerPx / (0.0254 / 96));
    }

    // 4. 指定した縮尺分母から適切なズームレベルを計算する関数
    function getZoomFromScale(scaleRatio, lat) {
      const metersPerPxForZoom0 = (40075016.686 * Math.cos(lat * Math.PI / 180)) / 256;
      const targetMetersPerPx = scaleRatio * (0.0254 / 96);
      return Math.log2(metersPerPxForZoom0 / targetMetersPerPx);
    }

    // 5. 地図移動・ズーム時に入力欄の数値を更新する関数
    function updateInputField(map, inputId) {
      const input = document.getElementById(inputId);
      if (document.activeElement !== input) {
        input.value = calculateScaleRatio(map);
      }
    }

    // 6. 各枠に地図を初期化してタイルを読み込む関数
    function createGsiMap(elementId, inputId, initialScale) {
      const input = document.getElementById(inputId);
      const initialZoom = getZoomFromScale(initialScale, centerLat);

      const map = L.map(elementId, {
        zoomSnap: 0.1,
        zoomDelta: 0.1
      }).setView([centerLat, centerLng], initialZoom);

      // maxNativeZoom: 地図データ自体の限界ズーム値（国土地理院は18）
      // maxZoom: 画面上拡大を許可する限界ズーム値（22まで拡大可能とし画像を引き伸ばして表示）
      const tileLayer = L.tileLayer(gsiTileUrl, {
        attribution: gsiAttribution,
        maxNativeZoom: 18,
        maxZoom: 22,
        minZoom: 5
      }).addTo(map);

      const marker = L.marker([centerLat, centerLng]).addTo(map);

      updateInputField(map, inputId);

      map.on('zoomend moveend', function() {
        updateInputField(map, inputId);
      });

      function applyScaleFromInput() {
        const val = parseFloat(input.value);
        if (!isNaN(val) && val > 0) {
          const targetZoom = getZoomFromScale(val, map.getCenter().lat);
          map.setZoom(targetZoom);
        }
      }

      input.addEventListener('change', applyScaleFromInput);
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          applyScaleFromInput();
          input.blur();
        }
      });

      return { map, marker, tileLayer };
    }

    // 7. それぞれの枠を描画
    const obj1 = createGsiMap('map1', 'scaleInput1', 25000); // 広域図
    const obj2 = createGsiMap('map2', 'scaleInput2', 7500);  // 中域図
    const obj3 = createGsiMap('map3', 'scaleInput3', 2000);  // 近隣地図

    const map1 = obj1.map, marker1 = obj1.marker;
    const map2 = obj2.map, marker2 = obj2.marker;
    const map3 = obj3.map, marker3 = obj3.marker;

    // 8. 表示範囲の赤枠描画処理
    let redFrame2on1 = null;
    function updateRedFrame2on1() {
      const bounds = map2.getBounds();
      if (redFrame2on1) {
        redFrame2on1.setBounds(bounds);
      } else {
        redFrame2on1 = L.rectangle(bounds, {
          color: '#ff0000',
          weight: 2,
          fill: true,
          fillColor: '#ff0000',
          fillOpacity: 0.1
        }).addTo(map1);
      }
    }

    let redFrame3on2 = null;
    function updateRedFrame3on2() {
      const bounds = map3.getBounds();
      if (redFrame3on2) {
        redFrame3on2.setBounds(bounds);
      } else {
        redFrame3on2 = L.rectangle(bounds, {
          color: '#ff0000',
          weight: 2,
          fill: true,
          fillColor: '#ff0000',
          fillOpacity: 0.1
        }).addTo(map2);
      }
    }

    setTimeout(function() {
      updateRedFrame2on1();
      updateRedFrame3on2();
    }, 200);

    map2.on('move zoom', updateRedFrame2on1);
    map3.on('move zoom', updateRedFrame3on2);

    // 9. 住所検索処理
    async function doAddressSearch() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const btn = document.getElementById('searchBtn');
      btn.textContent = '検索中...';
      btn.disabled = true;

      let lat = null;
      let lng = null;

      try {
        try {
          const gsiUrl = `https://msearch.gsi.go.jp/address-search-api/msearch/search?q=${encodeURIComponent(query)}`;
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 3000);

          const response = await fetch(gsiUrl, { signal: controller.signal });
          clearTimeout(timeoutId);

          if (response.ok) {
            const data = await response.json();
            if (data && data.length > 0 && data[0].geometry) {
              lng = data[0].geometry.coordinates[0];
              lat = data[0].geometry.coordinates[1];
            }
          }
        } catch (e) {
          console.warn('地理院API検索タイムアウト。バックアップ検索を使用します。');
        }

        if (!lat || !lng) {
          try {
            const osmUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=jp`;
            const response = await fetch(osmUrl);
            if (response.ok) {
              const data = await response.json();
              if (data && data.length > 0) {
                lat = parseFloat(data[0].lat);
                lng = parseFloat(data[0].lon);
              }
            }
          } catch (e) {
            console.warn('OSM API検索エラー:', e);
          }
        }

        if (lat && lng) {
          [map1, map2, map3].forEach(map => map.setView([lat, lng]));
          [marker1, marker2, marker3].forEach(marker => marker.setLatLng([lat, lng]));

          updateRedFrame2on1();
          updateRedFrame3on2();
        } else {
          alert('該当する住所・地番が見つかりませんでした。\n「長野県茅野市宮川」のように都道府県名から入力するか、町名まででお試しください。');
        }

      } catch (error) {
        console.error('Search error:', error);
        alert('検索処理中にエラーが発生しました。ネットワーク接続をご確認ください。');
      } finally {
        btn.textContent = '検索';
        btn.disabled = false;
      }
    }

    document.getElementById('searchBtn').addEventListener('click', doAddressSearch);
    document.getElementById('searchInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        doAddressSearch();
      }
    });

    // 10. 地図表示切替処理（地理院地図 ⇔ OpenStreetMap）
    let currentMapType = 'gsi';
    document.getElementById('toggleMapBtn').addEventListener('click', function() {
      const btn = this;
      
      if (currentMapType === 'gsi') {
        // 全ての地図を OpenStreetMap に変更（OSMの最大NativeZoomは19）
        [obj1, obj2, obj3].forEach(obj => {
          obj.tileLayer.options.maxNativeZoom = 19;
          obj.tileLayer.setUrl(osmTileUrl);
          obj.map.attributionControl.removeAttribution(gsiAttribution);
          obj.map.attributionControl.addAttribution(osmAttribution);
        });
        currentMapType = 'osm';
        btn.textContent = '地理院地図に切り替え';
        btn.style.backgroundColor = '#17a2b8'; // 青緑色に変更
      } else {
        // 全ての地図を 地理院地図 に変更（地理院の最大NativeZoomは18）
        [obj1, obj2, obj3].forEach(obj => {
          obj.tileLayer.options.maxNativeZoom = 18;
          obj.tileLayer.setUrl(gsiTileUrl);
          obj.map.attributionControl.removeAttribution(osmAttribution);
          obj.map.attributionControl.addAttribution(gsiAttribution);
        });
        currentMapType = 'gsi';
        btn.textContent = 'OpenStreetMapに切り替え';
        btn.style.backgroundColor = '#fd7e14'; // オレンジ色に変更
      }

      // 切り替え直後に3つの地図の表示領域を再計算・タイルの強制再描画を行う（欠損・非表示を防止）
      setTimeout(function() {
        [obj1, obj2, obj3].forEach(obj => {
          obj.map.invalidateSize();
          obj.tileLayer.redraw();
        });
      }, 50);
    });
  </script>

</body>
</html>
